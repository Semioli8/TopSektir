<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Sektir - Mini Futbol Oyunu</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #071b0c;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      position: relative;
      width: min(430px, 100vw);
      height: min(760px, 100vh);
      overflow: hidden;
      border-radius: 24px;
      background:
        linear-gradient(rgba(255,255,255,.08) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255,255,255,.08) 2px, transparent 2px),
        linear-gradient(180deg, #1fa045, #0d6c2b);
      background-size: 100% 120px, 80px 100%;
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
      border: 4px solid rgba(255,255,255,.12);
    }

    #game::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 160px;
      height: 160px;
      transform: translate(-50%, -50%);
      border: 4px solid rgba(255,255,255,.35);
      border-radius: 50%;
    }

    #game::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,.35);
      transform: translateY(-50%);
    }

    .hud {
      position: absolute;
      z-index: 5;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .box {
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.18);
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      text-shadow: 0 2px 4px rgba(0,0,0,.5);
    }

    #ball {
      position: absolute;
      z-index: 3;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      left: 178px;
      top: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      cursor: pointer;
      filter: drop-shadow(0 14px 14px rgba(0,0,0,.35));
      transform-origin: center;
      touch-action: manipulation;
    }

    #shadow {
      position: absolute;
      z-index: 2;
      width: 90px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,.28);
      left: 170px;
      bottom: 48px;
      filter: blur(2px);
      transform: scale(1);
    }

    #message {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(8px);
    }

    #message h1 {
      margin: 0 0 10px;
      font-size: 38px;
      line-height: 1.05;
    }

    #message p {
      margin: 8px 0 22px;
      font-size: 17px;
      opacity: .92;
      line-height: 1.45;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 15px 26px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      color: #08330f;
      background: white;
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
    }

    button:active {
      transform: scale(.97);
    }

    .hidden {
      display: none !important;
    }

    .tip {
      position: absolute;
      z-index: 5;
      bottom: 16px;
      left: 20px;
      right: 20px;
      text-align: center;
      font-size: 13px;
      opacity: .8;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,.55);
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="box">Skor: <span id="score">0</span></div>
      <div class="box">Rekor: <span id="best">0</span></div>
    </div>

    <div id="ball">⚽</div>
    <div id="shadow"></div>
    <div class="tip">Top yere düşmeden tıkla / dokun</div>

    <div id="message">
      <h1>Top Sektir</h1>
      <p>Topa tıkla, yere düşürme. Başlangıç kolaydır; skor arttıkça top yavaş yavaş hızlanır.</p>
      <button id="startBtn">Oyuna Başla</button>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const ball = document.getElementById('ball');
    const shadow = document.getElementById('shadow');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');

    let score = 0;
    let best = Number(localStorage.getItem('topSektirBest') || 0);
    let x = 178;
    let y = 330;
    let vx = 0;
    let vy = 0;
    let gravity = 0.095;
    let rotation = 0;
    let running = false;
    let animationId = null;

    bestEl.textContent = best;

    function resetGame() {
      const rect = game.getBoundingClientRect();
      x = rect.width / 2 - 37;
      y = rect.height * 0.18;
      vx = 0;
      vy = 0;
      gravity = 0.095;
      rotation = 0;
      score = 0;
      scoreEl.textContent = score;
      updateBall();
    }

    function startGame() {
      resetGame();
      running = true;
      message.classList.add('hidden');
      cancelAnimationFrame(animationId);
      loop();
    }

    function endGame() {
      running = false;
      cancelAnimationFrame(animationId);

      if (score > best) {
        best = score;
        localStorage.setItem('topSektirBest', best);
        bestEl.textContent = best;
      }

      message.innerHTML = `
        <h1>Oyun Bitti</h1>
        <p>Skorun: <strong>${score}</strong><br>Rekorun: <strong>${best}</strong></p>
        <button id="restartBtn">Tekrar Oyna</button>
      `;
      message.classList.remove('hidden');
      document.getElementById('restartBtn').addEventListener('click', startGame);
    }

    function kickBall(event) {
      if (!running) return;
      event.preventDefault();

      score++;
      scoreEl.textContent = score;

      vy = -4.2 - Math.min(score * 0.055, 4.3);
      vx += (Math.random() - 0.5) * 1.7;
      vx = Math.max(Math.min(vx, 4.2), -4.2);
      gravity = 0.095 + Math.min(score * 0.0065, 0.34);

      ball.animate([
        { transform: `rotate(${rotation}deg) scale(1)` },
        { transform: `rotate(${rotation + 20}deg) scale(1.18)` },
        { transform: `rotate(${rotation + 40}deg) scale(1)` }
      ], { duration: 130, easing: 'ease-out' });
    }

    function updateBall() {
      ball.style.left = `${x}px`;
      ball.style.top = `${y}px`;
      ball.style.transform = `rotate(${rotation}deg)`;

      const gameHeight = game.clientHeight;
      const distanceToGround = Math.max(0, gameHeight - y - 74 - 54);
      const scale = 1 + Math.max(0, 1 - distanceToGround / 420) * 0.45;
      shadow.style.left = `${x - 8}px`;
      shadow.style.transform = `scale(${scale})`;
      shadow.style.opacity = `${0.18 + Math.min(scale - 1, .45)}`;
    }

    function loop() {
      if (!running) return;

      const width = game.clientWidth;
      const height = game.clientHeight;

      vy += gravity;
      x += vx;
      y += vy;
      rotation += vx * 2.2;

      if (x <= 0) {
        x = 0;
        vx *= -0.82;
      }

      if (x + 74 >= width) {
        x = width - 74;
        vx *= -0.82;
      }

      if (y <= 72) {
        y = 72;
        vy *= -0.35;
      }

      if (y + 74 >= height - 42) {
        y = height - 42 - 74;
        updateBall();
        endGame();
        return;
      }

      updateBall();
      animationId = requestAnimationFrame(loop);
    }

    ball.addEventListener('mousedown', kickBall);
    ball.addEventListener('touchstart', kickBall, { passive: false });
    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
